[binaries]
fortran = 'gfortran'

[built-in options]
fortran_args = ['-fopenmp', '-fcoarray=lib', '-Wall', '-O3', '-fdefault-integer-8', '-ffree-line-length-0', '-march=native', '-mtune=native', '-funroll-loops', '-fprefetch-loop-arrays', '-fvariable-expansion-in-unroller', '-ffast-math']
fortran_link_args = ['-fopenmp', '-fcoarray=lib', '-fdefault-integer-8', '-lcaf_mpi', '-L${MKLROOT}/lib/intel64', '-Wl,--no-as-needed', '-lmkl_gf_ilp64', '-lmkl_gnu_thread', '-lmkl_core', '-lgomp', '-lpthread', '-lm', '-ldl']

[properties]
launcher = 'cafrun'

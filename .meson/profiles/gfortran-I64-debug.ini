[binaries]
fortran = 'gfortran'

[built-in options]
fortran_args = ['-fopenmp', '-fcoarray=lib', '-Wall', '-O0', '-ffpe-trap=invalid', '-g', '-fcheck=all', '-fdefault-integer-8', '-ffree-line-length-0']
fortran_link_args = ['-fopenmp', '-fcoarray=lib', '-ffpe-trap=invalid', '-fdefault-integer-8', '-lcaf_mpi', '-L${MKLROOT}/lib/intel64', '-Wl,--no-as-needed', '-lmkl_gf_ilp64', '-lmkl_gnu_thread', '-lmkl_core', '-lgomp', '-lpthread', '-lm', '-ldl']

[properties]
launcher = 'cafrun'
